<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>CoffeeCounter - Setup</title>
    <meta name="description" content="One-time setup: create the first CoffeeCounter admin account.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CoffeeCounter">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D89A52' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 8h1a4 4 0 1 1 0 8h-1'/%3E%3Cpath d='M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z'/%3E%3Cline x1='6' y1='1' x2='6' y2='4'/%3E%3Cline x1='10' y1='1' x2='10' y2='4'/%3E%3Cline x1='14' y1='1' x2='14' y2='4'/%3E%3C/svg%3E">
    <meta property="og:title" content="CoffeeCounter - Setup">
    <meta property="og:description" content="One-time setup: create the first CoffeeCounter admin account.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/webauthn.js"></script>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="icon-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                <g class="icon-sun">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </g>
            </svg>
        </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="display:block; width:48px; height:48px; margin:0 auto 10px; color:var(--primary-color);" aria-hidden="true">
            <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/>
            <line x1="6" y1="1" x2="6" y2="4"/>
            <line x1="10" y1="1" x2="10" y2="4"/>
            <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        <h1>Welcome to CoffeeCounter</h1>
        <div class="card">
            <h2>Create the first account</h2>
            <p style="opacity:0.75; font-size:0.9rem; margin-bottom:1rem;">
                This is a one-time step. The first account becomes the admin and can
                add every other user afterwards from the admin panel — no self-signup.
            </p>
            <div class="form-row">
                <div class="field">
                    <label for="setup-name">Your name</label>
                    <input type="text" id="setup-name" placeholder="e.g. Ben" maxlength="50">
                </div>
                <div class="field">
                    <label for="setup-pin" id="setup-pin-label">Choose a PIN</label>
                    <input type="password" inputmode="numeric" id="setup-pin" placeholder="••••" maxlength="10">
                </div>
            </div>
            <button id="setup-btn" type="button">Create admin account</button>
            <div class="error-message" id="error-message"></div>
        </div>
    </div>

    <div class="site-footer">CoffeeCounter · self-hosted</div>

    <script src="assets/app.js"></script>
    <script>
        initThemeToggle();

        let pinLength = 4;
        (async () => {
            const status = await (await fetch('/api/auth/status')).json();
            if (!status.setupRequired) { window.location.href = '/index.html'; return; }
            pinLength = status.pinLength || 4;
            document.getElementById('setup-pin-label').textContent = `Choose a PIN (${pinLength} digits)`;
            document.getElementById('setup-pin').maxLength = pinLength;
            document.getElementById('setup-pin').placeholder = '•'.repeat(pinLength);
        })();

        document.getElementById('setup-btn').addEventListener('click', async () => {
            const name = document.getElementById('setup-name').value.trim();
            const pin = document.getElementById('setup-pin').value.trim();
            const errEl = document.getElementById('error-message');
            errEl.textContent = '';
            if (!name) { errEl.textContent = 'Please enter your name'; return; }
            if (pin.length !== pinLength || !/^\d+$/.test(pin)) {
                errEl.textContent = `PIN must be exactly ${pinLength} digits`;
                return;
            }
            try {
                await api('/api/auth/setup', { method: 'POST', body: JSON.stringify({ name, pin }) });
                window.location.href = '/dashboard.html';
            } catch (e) {
                errEl.textContent = e.message || 'Setup failed';
            }
        });
    </script>
</body>
</html>

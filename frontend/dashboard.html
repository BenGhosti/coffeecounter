<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>CoffeeCounter - Dashboard</title>
    <meta name="description" content="Your drink dashboard: log a drink, browse charts, export CSV.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EFE8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CoffeeCounter">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D89A52' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 8h1a4 4 0 1 1 0 8h-1'/%3E%3Cpath d='M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z'/%3E%3Cline x1='6' y1='1' x2='6' y2='4'/%3E%3Cline x1='10' y1='1' x2='10' y2='4'/%3E%3Cline x1='14' y1='1' x2='14' y2='4'/%3E%3C/svg%3E">
    <meta property="og:title" content="CoffeeCounter - Dashboard">
    <meta property="og:description" content="Your drink dashboard: log a drink, browse charts, export CSV.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/vendor/chart.umd.min.js"></script>
</head>
<body>
    <div class="container wide">
        <div class="topnav">
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
                    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/>
                    <line x1="6" y1="1" x2="6" y2="4"/>
                    <line x1="10" y1="1" x2="10" y2="4"/>
                    <line x1="14" y1="1" x2="14" y2="4"/>
                </svg>
                CoffeeCounter
            </div>
            <div class="nav-actions">
                <span id="who" style="opacity:0.7; font-size:0.85rem; margin-right:8px;"></span>
                <a href="#" id="admin-link" style="display:none;">Admin</a>
                <a href="#" id="settings-link" style="display:none;">Settings</a>
                <a href="#" id="logout-link">Sign out</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" style="position:static;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path class="icon-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        <g class="icon-sun">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </g>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Greeting: the signed-in user's name, centered and slightly
             larger than the card titles, but still subtle. -->
        <div class="page-greeting" aria-hidden="true">
            <span id="who-big"></span>
        </div>

        <!-- My Stats: trigger + undo -->
        <div class="card">
            <div class="card-head">
                <h2>Log a drink</h2>
                <button class="secondary" id="undo-btn">Undo last</button>
            </div>
            <div class="trigger-grid" id="trigger-grid"></div>
            <div class="undo-confirm" id="undo-confirm" role="dialog" aria-live="polite"></div>
        </div>

        <!-- Charts toolbar: range + scope + export -->
        <div class="chart-toolbar">
            <div class="range-switcher" id="range-switcher">
                <button data-range="day">Day</button>
                <button data-range="week">Week</button>
                <button data-range="month" class="active">Month</button>
                <button data-range="year">Year</button>
                <button data-range="2year">2 Years</button>
                <button data-range="all">All</button>
            </div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <div class="segmented" id="scope-switcher">
                    <button type="button" data-scope="global">Everyone</button>
                    <button type="button" data-scope="user" class="active">Just me</button>
                </div>
                <button class="secondary" id="export-btn">Export CSV</button>
            </div>
        </div>

        <!-- Summary chips for the active range/scope -->
        <div class="summary-grid" id="summary-grid">
            <div class="stat-chip">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="stat-total">-</span>
                <span class="stat-sub" id="stat-total-sub"></span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">Top drink</span>
                <span class="stat-value"><span class="stat-dot" id="stat-top-dot" style="display:none;"></span><span id="stat-top">-</span></span>
                <span class="stat-sub" id="stat-top-sub"></span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">Busiest day</span>
                <span class="stat-value" id="stat-busiest">-</span>
                <span class="stat-sub" id="stat-busiest-sub"></span>
            </div>
            <div class="stat-chip">
                <span class="stat-label">Avg per day</span>
                <span class="stat-value" id="stat-perday">-</span>
                <span class="stat-sub" id="stat-perday-sub"></span>
            </div>
        </div>

        <div class="card">
            <h2>Over time</h2>
            <div class="chart-wrap"><canvas id="line-chart"></canvas></div>
        </div>

        <div class="square-grid">
            <div class="card">
                <h2>Breakdown</h2>
                <div class="chart-wrap"><canvas id="pie-chart"></canvas></div>
            </div>
            <div class="card" id="leaderboard-card">
                <h2>Who&rsquo;s drinking most</h2>
                <div class="square-fill" id="leaderboard-body"></div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom:1rem;">Your webhook links</h2>
            <div id="webhook-list"></div>
            <div class="status-message" id="webhook-status"></div>
        </div>

        <div class="card">
            <h2>Recent activity</h2>
            <table>
                <thead><tr><th>When</th><th>Drink</th><th>Source</th></tr></thead>
                <tbody id="recent-body"></tbody>
            </table>
        </div>
    </div>

    <div class="site-footer">CoffeeCounter · Made by BenGhosti</div>

    <script src="assets/app.js"></script>
    <script src="assets/dashboard.js"></script>
</body>
</html>
